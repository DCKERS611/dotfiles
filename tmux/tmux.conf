# Mouse selection, pane resizing, and scrollback.
set-option -g mouse on
set-option -g history-limit 50000

# Start window and pane numbering at 1 and close numbering gaps.
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Create new windows and panes in the current pane's directory.
bind-key c new-window -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"

# Split directly with Ctrl+Arrow, without the tmux prefix.
bind-key -n C-Up split-window -v -c "#{pane_current_path}"
bind-key -n C-Right split-window -h -c "#{pane_current_path}"

# Select panes with Vim's standard h=left, j=down, k=up, l=right layout.
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Return to the previously active window with Prefix+b.
bind-key b last-window

# Hold the uppercase direction key to resize repeatedly.
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Show the session and window names plus the local date and time.
set-option -g status-style 'fg=black,bg=green'
set-option -g status-left-length 30
set-option -g status-left '#[fg=#000000,bg=green] session: #S '
set-option -g status-right-length 50
set-option -g status-right '%Y-%m-%d %H:%M '
set-window-option -g window-status-style 'fg=#7f336c,bg=green'
set-window-option -g window-status-current-style 'fg=#000000,bg=green'
set-window-option -g window-status-format ' #I:#W '
set-window-option -g window-status-current-format ' #I:#W* '

# Reload this file with Prefix+r.
bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
